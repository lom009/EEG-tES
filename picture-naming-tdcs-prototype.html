<style>

74px minmax(0,1fr);gap:18px;padding:0 28px 40px;max-width:1800px;margin:auto}.card{background:white;border-radius:12px;box-shadow:0 4px 16px #38467606;border:1px solid #edf0f8}.side{padding:22px;align-self:start}.section{margin-top:20px;padding:17px;background:#f8fafc;border-radius:8px}.kv{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:13px}.kv span:first-child{color:var(--muted)}.kv b{font-weight:500;text-align:right}.steps{margin-top:26px}.step{display:flex;gap:12px;align-items:center;margin:19px 0;color:var(--muted)}.step i{font-style:normal;width:27px;height:27px;display:grid;place-items:center;background:#edf1f8;border-radius:50%;font-size:12px}.step.active{color:var(--p);font-weight:600}.step.active i{background:var(--p);color:white}.step.done i{background:#e7f5ef;color:var(--green)}.content{padding:24px;min-height:720px}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px}.heading p{color:var(--muted);margin-top:5px}.tabs{display:flex;gap:30px;border-bottom:1px solid var(--line);margin:20px 0 24px}.tab{border:none;border-radius:0;padding:12px 0;background:none;color:var(--muted)}.tab.on{color:var(--p);border-bottom:3px solid var(--p);font-weight:600}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}.field label{display:block;color:var(--muted);margin-bottom:7px}.form-section{border:1px solid var(--line);border-radius:9px;padding:20px;margin-top:20px}.form-section h2{margin-bottom:17px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice button{text-align:left;padding:13px 16px}.choice button.selected{border-color:var(--p);background:#f5f5ff;color:var(--p)}.choice small{display:block;margin-top:4px;font-size:12px}.pictures{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.thumb{border:1px solid var(--line);border-radius:8px;text-align:center;padding:13px 8px;background:white}.thumb svg{width:60px;height:60px;display:block;margin:0 auto 8px}.thumb span{font-size:12px;color:var(--muted)}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}.note{padding:12px 15px;border-radius:7px;background:#f5f7fb;color:var(--muted);font-size:12px;margin-top:18px}.timeline{display:flex;align-items:center;gap:10px;padding:16px;border-radius:8px;background:#f8fafc;flex-wrap:wrap}.timeline b{font-weight:500}.timeline i{color:#b2bfd1;font-style:normal}.setup-sub{margin:0 0 10px;color:var(--muted);font-size:12px}.run-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;margin-top:20px}.stage{min-height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fcfdff;border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}.stage svg{width:230px;height:230px}.stage .phase{position:absolute;left:18px;top:15px;color:var(--muted);font-size:12px}.stage .hint{position:absolute;bottom:20px;color:var(--muted)}.stage .fix{font-size:70px;font-weight:200;color:#64799b}.run-progress{height:4px;background:#edf1f8;border-radius:8px;margin-top:16px;overflow:hidden}.run-progress span{display:block;height:100%;background:var(--p);transition:width .3s}.monitor{border:1px solid var(--line);border-radius:10px;padding:18px}.stim-diagram{height:80px;background:#f6f3ff;border-radius:8px;margin:15px 0;display:grid;place-items:center}.stim-diagram svg{width:90%;height:65px}.bigtime{font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:1px;margin-top:6px}.monitor button{width:100%;margin-top:16px}.status-dot{width:7px;height:7px;background:var(--green);border-radius:50%;display:inline-block;margin-right:7px}.record-box{border:1px solid var(--line);border-radius:8px;padding:20px;margin-top:16px;min-height:118px}.wave{height:35px;display:flex;align-items:center;gap:3px;margin:10px 0}.wave i{display:block;width:3px;border-radius:3px;background:#8ca4ff}.review-actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}.review-actions .selected{box-shadow:0 0 0 2px currentColor inset}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px}.metric{background:#f8fafc;border-radius:8px;padding:18px}.metric label{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:27px;font-weight:600;margin-top:8px}.metric small{font-size:11px}.chart{border:1px solid var(--line);padding:18px;border-radius:9px;margin-top:22px}.chart svg{width:100%;height:210px}.table-wrap{overflow:auto;margin-top:20px}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th{font-weight:500;text-align:left;background:#f6f8fc;color:var(--muted);padding:13px}td{padding:13px;border-bottom:1px solid var(--line)}td button{font-size:12px;padding:4px 9px}.overlay{position:fixed;inset:0;background:#19223660;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{width:520px;max-width:100%;padding:26px;border-radius:14px;background:white;box-shadow:0 20px 70px #101b3430}.dialog .heading{margin-bottom:18px}.close{font-size:22px;border:none;background:none;padding:0 5px;color:var(--muted)}.checkline{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.checkline .ok{color:var(--green)}.checkline button{padding:5px 10px;font-size:12px}.demo-link{border:none;background:transparent;color:var(--muted);font-size:12px;padding:4px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#273244;color:white;padding:12px 20px;border-radius:8px;z-index:80}.ring{margin:25px auto;width:110px;height:110px;border-radius:50%;border:5px solid #edf0ff;border-top-color:var(--p);display:grid;place-items:center;color:var(--p);font-size:32px}.present .side,.present .monitor,.present .record-box,.present .tabs{display:none}.present .layout,.present .run-grid{grid-template-columns:1fr}.present .stage{min-height:65vh}.present .stage svg{width:300px;height:300px}.mini{font-size:11px;color:var(--muted)} button:focus-visible{outline:3px solid #a7baff;outline-offset:3px}.content{min-width:0}.dialog{max-height:90vh;overflow:auto}.present-start{margin-top:20px}.result-context{flex-wrap:wrap}.chart-empty{text-align:center;padding:40px;color:var(--muted)}

/* Desktop experiment layout follows the envelope execution page. */
.naming-run{display:grid;grid-template-columns:minmax(0,2.45fr) minmax(276px,1fr);gap:16px;max-width:1800px;margin:0 auto;padding:20px 24px 24px}
.naming-main{min-width:0}
.naming-context{min-height:40px;flex-wrap:wrap;margin-bottom:12px}
.naming-context .pill{font-size:12px;padding:7px 11px}
.naming-panel{padding:20px;min-width:0}
.naming-panel-heading{gap:12px;margin-bottom:12px}
.naming-panel-heading h1,.naming-panel-heading h2,.naming-monitor h2{font-size:16px}
.naming-panel-heading .row{gap:8px;flex-wrap:wrap}
.naming-panel-heading button{padding:6px 12px;font-size:12px;white-space:nowrap}
.naming-stage{min-height:clamp(260px,33vh,360px);padding:24px;text-align:center}
.naming-stage p{margin-top:8px;color:var(--muted)}
.naming-stage svg{width:200px;height:200px}
.naming-scoring{margin-top:16px}
.naming-trial{white-space:nowrap;font-variant-numeric:tabular-nums}
.naming-trial b,.count-correct{color:var(--green)}
.count-incorrect{color:var(--red)}
.naming-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;color:var(--muted);font-size:13px}
.naming-stats div{display:flex;justify-content:center;align-items:center;gap:10px;background:#f6f8fb;padding:10px 4px;border-radius:5px}
.naming-stats b:not([class]){color:var(--ink)}
.naming-response{min-height:64px;margin-top:12px;padding:14px}
.naming-next{margin-left:auto}
.naming-example{margin-top:8px;text-align:right}
.naming-monitor{display:flex;flex-direction:column;gap:16px;padding:18px 16px;min-width:0}
.naming-stim{background:#f6f8fb;border-radius:7px;margin-top:10px;padding:10px 12px}
.naming-stim .kv:first-child{margin-top:0}
.naming-stim .stim-diagram{height:58px;margin:10px 0 4px}
.naming-stim .stim-diagram svg{height:42px}
.naming-settings{border-top:1px dashed var(--line);padding-top:14px}
.naming-settings dl{margin:10px 0 0}
.naming-settings dl div{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:center;margin-top:7px;font-size:13px}
.naming-settings dt{color:var(--muted)}
.naming-settings dd{margin:0;padding:6px 10px;border:1px solid var(--line);border-radius:5px;background:#fbfcfe}
.naming-controls{margin-top:auto;display:grid;gap:8px}
.naming-controls .row{gap:8px}
.naming-controls .row button{flex:1;white-space:nowrap}
button.naming-start{background:#31885e;border-color:#31885e;color:#fff}
button.naming-start:hover{background:#26704c;border-color:#26704c}
.naming-presentation{grid-template-columns:1fr}
.naming-presentation .stage .naming-start{margin-top:16px}
.voice-review{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,330px);gap:4px 12px;background:#f6f8fb;border-radius:7px;padding:10px;margin-top:10px;overflow-wrap:anywhere}
.voice-review audio{grid-column:2;grid-row:1/span 2;align-self:center;width:100%;height:34px}
.naming-mic{display:block;width:100%;padding:0;border:0;text-align:left;color:var(--p);background:transparent}
.naming-hosted-note{margin-top:9px;padding:8px 10px}
</style></head><body><header><div class="logo">EEG<em>·</em>tES</div><div class="header-right"><span class="muted">科研实验平台</span><span class="badge purple">交互原型 · 模拟数据</span><div class="avatar">TA</div></div></header><div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
// Independent research prototype. Stimulation is simulated. The local preview can record and score audio.
const shapes={apple:'<path d="M120 65c-12-20-43-18-57 3-23 35-4 102 26 112 14 5 20-3 31-3s17 8 31 3c30-10 49-77 26-112-14-21-45-23-57-3Z"/><path d="M120 64c-5-22 5-36 17-44M128 42c18-22 42-17 42-17-4 20-24 31-42 17"/>',cup:'<path d="M57 62h111v96c0 23-21 36-56 36s-55-13-55-36Z"/><path d="M168 79h14c35 0 35 59 0 59h-14M45 205h139M88 40V20m27 20V20m27 20V20"/>',key:'<circle cx="77" cy="88" r="39"/><circle cx="77" cy="88" r="12"/><path d="m105 115 78 78 17-17-15-15 12-12-19-19-12 12-35-35"/>',umbrella:'<path d="M30 112a90 90 0 0 1 180 0c-16-15-30-15-45 0-15-15-30-15-45 0-15-15-30-15-45 0-15-15-30-15-45 0Z"/><path d="M120 112v70c0 34 39 34 39 4M120 22V10M75 112c0-54 21-80 45-90 24 10 45 36 45 90"/>',clock:'<circle cx="120" cy="120" r="83"/><path d="M120 63v57l38 22M120 37v12m0 142v12M37 120h12m142 0h12"/><circle cx="120" cy="120" r="4"/>',fish:'<path d="M35 119c33-71 96-72 137-24l39-30v108l-39-30c-41 48-104 47-137-24Z"/><path d="M84 66c-20 33-20 73 0 106M112 62l15-25 27 43M113 177l16 22 22-37"/><circle cx="66" cy="108" r="4"/>'};
const items=[['apple','苹果','680'],['cup','杯子','742'],['key','钥匙','835'],['umbrella','雨伞','910'],['clock','时钟','765'],['fish','鱼','698']].map((x,i)=>({id:i+1,key:x[0],word:x[1],rt:+x[2]}));
const s={page:'setup',mode:'online',order:'fixed',subject:'S-001',fix:1,window:4,isi:1,phase:'ready',index:0,records:[],stim:'未开始',elapsed:0,selected:null,rt:null,ready:false,checks:[false,false,false],present:false,token:0,session:null,originalRt:null,trialPresented:false,deadline:0,endReason:null};let ticker,rampTimer;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const art=(k)=>`<svg viewBox="0 0 240 240" aria-label="示例图片" fill="none" stroke="#344156" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">${shapes[k]}</svg>`;
const time=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
let queue=[...items];
const active=()=>s.page==='run'&&(s.stim==='缓降中'||!['ready','finished'].includes(s.phase));
const config=()=>s.page==='setup'?s:(s.session||s);
const snapshot=()=>({id:'PN-'+Date.now().toString(36).toUpperCase(),subject:s.subject.trim(),mode:s.mode,order:s.order,fix:s.fix,window:s.window,isi:s.isi,createdAt:new Date().toISOString(),sequence:queue.map(x=>x.id)});
function configure(key,value){if(s[key]===value)return;s[key]=value;s.ready=false;s.checks=[false,false,false]}
function changeMode(value){configure('mode',value);render()}
function clearTimers(){s.token++;clearInterval(ticker);clearInterval(rampTimer)}
function remaining(){return Math.max(0,Math.ceil((s.deadline-Date.now())/1000))}
function toast(t){document.getElementById('toast').innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>document.getElementById('toast').innerHTML='',2500)}
function shell(inner){const cfg=config();document.body.classList.toggle('present',s.present);document.getElementById('app').innerHTML=`<div class="topbar"><div class="crumb"><span class="pill">图片命名实验</span><span class="pill muted">受试者：${esc(cfg.subject)}</span><span class="pill muted">${s.page==='setup'?'实验草稿':esc(cfg.id)}</span><span class="badge purple">单刺激模式</span></div><span class="mini">示例材料 · 不连接实际设备</span></div><main class="layout"><aside class="card side"><h2>实验信息</h2><div class="section"><h3>图片命名 · tDCS</h3><div class="kv"><span>任务类型</span><b>物体命名</b></div><div class="kv"><span>图集</span><b>常见物品 01</b></div><div class="kv"><span>试次数</span><b>6 次</b></div><div class="kv"><span>实验设计</span><b>${cfg.mode==='online'?'刺激期间命名':'刺激后命名'}</b></div></div><div class="steps">${['实验设置','命名实验','实验结果'].map((x,i)=>`<div class="step ${i===['setup','run','results'].indexOf(s.page)?'active':i<['setup','run','results'].indexOf(s.page)?'done':''}"><i>${i+1}</i>${x}</div>`).join('')}</div><div class="section"><h3>刺激方案摘要</h3><div class="kv"><span>范式</span><b>tDCS</b></div><div class="kv"><span>方案</span><b>示例方案 01</b></div><div class="kv"><span>状态</span><b>${s.stim}</b></div><button class="demo-link" style="padding:12px 0 0;color:var(--p)" onclick="plan()">查看方案与点位 →</button></div><div class="note">图片呈现与连续刺激分别计时。每次换图不会重新启动刺激。</div></aside><section class="card content">${inner}</section></main>`}
function tabs(){return `<div class="tabs">${['实验设置','命名实验','实验结果'].map((x,i)=>`<button class="tab ${['setup','run','results'][i]===s.page?'on':''}" onclick="navigate('${['setup','run','results'][i]}')">${x}</button>`).join('')}</div>`}
function render(){if(s.page==='setup')setup();else if(s.page==='run')run();else results()}
function setup(){shell(`<div class="heading"><div><h1>图片命名实验</h1><p>设置图片材料与任务时序，观察命名表现的变化。</p></div><span class="badge">实验草稿</span></div>${tabs()}<div class="form-grid"><div class="field"><label>受试者编码</label><input value="${esc(s.subject)}" maxlength="30" oninput="configure('subject',this.value)" aria-label="受试者编码"></div><div class="field"><label>命名任务</label><input value="物体命名" readonly></div></div><div class="form-section"><h2>实验设计</h2><div class="choice"><button class="${s.mode==='online'?'selected':''}" onclick="changeMode('online')"><b>刺激期间命名 <span class="mini">Online</span></b><small>连续刺激期间，依次呈现图片并口头命名</small></button><button class="${s.mode==='offline'?'selected':''}" onclick="changeMode('offline')"><b>刺激后命名 <span class="mini">Offline</span></b><small>先完成刺激，再开始图片命名任务</small></button></div></div><div class="form-section"><div class="heading"><h2>图片材料</h2><span class="muted">常见物品 01 · 6 张</span></div><p class="setup-sub">用于演示流程的线描图；正式实验需替换为经确认的科研材料。</p><div class="pictures">${items.map(x=>`<div class="thumb">${art(x.key)}<span>${String(x.id).padStart(2,'0')} · ${x.word}</span></div>`).join('')}</div></div><div class="form-section"><h2>任务时序</h2><div class="form-grid" style="grid-template-columns:repeat(4,1fr)"><div class="field"><label>注视点 / 秒</label><select onchange="configure('fix',+this.value)"><option ${s.fix===1?'selected':''}>1</option><option ${s.fix===2?'selected':''}>2</option></select></div><div class="field"><label>回答窗口 / 秒</label><select onchange="configure('window',+this.value)"><option ${s.window===4?'selected':''}>4</option><option ${s.window===6?'selected':''}>6</option></select></div><div class="field"><label>试次间隔 / 秒</label><select onchange="configure('isi',+this.value)"><option ${s.isi===1?'selected':''}>1</option><option ${s.isi===2?'selected':''}>2</option></select></div><div class="field"><label>呈现顺序</label><select onchange="configure('order',this.value)"><option value="fixed" ${s.order==='fixed'?'selected':''}>固定顺序</option><option value="random" ${s.order==='random'?'selected':''}>随机顺序</option></select></div></div><div class="timeline" style="margin-top:16px"><b>＋ 注视点</b><i>→</i><b>图片呈现</b><i>→</i><b>口头命名</b><i>→</i><b>记录与评分</b><i>→</i><b>下一张</b></div></div><div class="foot"><small>本原型使用模拟回答、示例反应时与设备反馈。</small><div class="row"><button onclick="sampleResults()">查看示例结果</button><button class="primary" onclick="prepare()">准备实验 →</button></div></div>`)}
let modalLocked=false;
function dialog(html,locked=false){modalLocked=locked;document.getElementById('modal').innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="${locked?'刺激停止确认':'实验操作'}">${html}</div></div>`;document.querySelector('.dialog button:not(:disabled)')?.focus()}
function closeModal(){document.getElementById('modal').innerHTML='';modalLocked=false}
document.addEventListener('keydown',e=>{const box=document.querySelector('.dialog');if(!box)return;if(e.key==='Escape'&&!modalLocked){closeModal();return}if(e.key==='Tab'){const a=[...box.querySelectorAll('button:not(:disabled),input,select')];if(!a.length)return;if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
function plan(){dialog(`<div class="heading"><h2>刺激方案 · 示例 01</h2><button class="close" onclick="closeModal()">×</button></div><div class="note">此处引用独立刺激方案页。以下为交互示意，不作为实际刺激配置。</div><div class="kv"><span>范式</span><b>tDCS · 连续刺激</b></div><div class="kv"><span>物理点位示意</span><b>P7 / CH2 · P3 / CH5</b></div><div class="kv"><span>启动时机</span><b>${config().mode==='online'?'实验开始，缓升后呈现首图':'实验开始，刺激结束后呈现首图'}</b></div><div class="kv"><span>演示缓升 / 缓降</span><b>各 3 秒（演示加速）</b></div><div class="note">实际电流、时长、点位和任务时序由科研方案与设备配置确定。刺激计划与任务结束策略需在正式实现前确认。</div><div class="foot"><button class="primary" onclick="closeModal()">知道了</button></div>`)}
function prepare(){if(!s.subject.trim())return toast('请填写受试者编码');dialog(`<div class="heading"><h2>实验准备</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">完成刺激和材料的演示检查。</p>${['刺激设备与阻抗','图片材料（6 / 6）','麦克风与录音'].map((x,i)=>`<div class="checkline"><span>${x}</span>${s.checks[i]?'<span class="ok">✓ 已就绪（模拟）</span>':`<button onclick="s.checks[${i}]=true;prepare()">模拟检查</button>`}</div>`).join('')}<div class="note">${localAsrPage?'进入实验后可选择连接麦克风，刺激环节使用模拟状态。':'本页使用模拟录音和刺激。'}</div><div class="foot"><button onclick="s.checks=[true,true,true];prepare()">一键模拟就绪</button><button class="primary" ${s.checks.every(Boolean)?'':'disabled'} onclick="enter()">进入实验 →</button></div>`)}
function enter(){if(!s.checks.every(Boolean))return;clearVoiceRecords();clearTimers();closeModal();queue=[...items];if(s.order==='random'){for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}}Object.assign(s,{ready:true,page:'run',phase:'ready',index:0,records:[],stim:'未开始',elapsed:0,selected:null,rt:null,originalRt:null,trialPresented:false,endReason:null,present:false});s.session=snapshot();render()}
function navigate(page){
 if(page===s.page)return;
 if(active())return toast('请先完成或结束当前实验');
 if(page==='run'){
  if(s.phase==='finished'&&s.page==='results')return toast('请点击「新一次实验」');
  if(!s.ready||s.phase==='finished')return prepare();
 }
 if(page==='results'&&s.phase!=='finished')return toast('完成实验后可查看本次结果');
 s.page=page;
 if(page!=='run'){s.present=false;releaseMic();if(s.phase==='ready'&&s.session)s.session.localAsr=false;}
 render();
}
const asrMode=document.querySelector('meta[name="naming-asr"]')?.content;
const localAsrPage=Boolean(asrMode),hostedAsr=asrMode==='hosted';
const asrLabel=hostedAsr?'在线识别':'本地识别';
const voiceUrls=new Set();
let micCapture=null,micEpoch=0,micPending=false,asrRequest=null;
const initialScore={正确:'correct',错误:'wrong',无反应:'none'};

function releaseMic(){
 ++micEpoch;
 micPending=false;
 asrRequest?.abort();
 asrRequest=null;
 micCapture?.close();
 micCapture=null;
}
function clearVoiceRecords(){
 releaseMic();
 for(const url of voiceUrls)URL.revokeObjectURL(url);
 voiceUrls.clear();
 s.voiceTrial=null;
}

async function openCapture(stream){
 const context=new AudioContext();
 const processor=URL.createObjectURL(new Blob([`
  class NamingRecorder extends AudioWorkletProcessor {
   constructor(){
    super();
    this.frames=null;
    this.length=0;
    this.port.onmessage=({data})=>{
     if(data==='start'){this.frames=[];this.length=0;return}
     const samples=new Float32Array(this.length);
     let offset=0;
     for(const frame of this.frames||[]){samples.set(frame,offset);offset+=frame.length}
     this.frames=null;this.length=0;
     this.port.postMessage(samples,[samples.buffer]);
    };
   }
   process(inputs){
    const input=inputs[0]?.[0];
    if(this.frames&&input&&this.length<sampleRate*7){this.frames.push(input.slice());this.length+=input.length}
    return true;
   }
  }
  registerProcessor('naming-recorder',NamingRecorder);
 `],{type:'text/javascript'}));
 try{
  await context.audioWorklet.addModule(processor);
  const source=context.createMediaStreamSource(stream);
  const node=new AudioWorkletNode(context,'naming-recorder',{channelCount:1});
  const mute=context.createGain();mute.gain.value=0;
  source.connect(node).connect(mute).connect(context.destination);
  let resumeTimer;
  try{
   await Promise.race([context.resume(),new Promise((_,reject)=>{
    resumeTimer=setTimeout(()=>reject(new Error('录音未就绪，请重新连接麦克风')),2500);
   })]);
  }finally{clearTimeout(resumeTimer)}
  let pending=null;
  node.port.onmessage=({data})=>{
   if(!pending)return;
   const {resolve,timer}=pending;pending=null;clearTimeout(timer);resolve(data);
  };
  return {
   rate:context.sampleRate,
   live:()=>stream.getAudioTracks().some(track=>track.readyState==='live'),
   start:()=>node.port.postMessage('start'),
   stop:()=>new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>{pending=null;reject(new Error('没有收到录音'))},1800);
    pending={resolve,reject,timer};
    node.port.postMessage('stop');
   }),
   close:()=>{
    if(pending){clearTimeout(pending.timer);pending.reject(new Error('录音已结束'));pending=null}
    stream.getTracks().forEach(track=>track.stop());
    void context.close().catch(()=>{});
   }
  };
 }catch(error){void context.close().catch(()=>{});throw error}
 finally{URL.revokeObjectURL(processor)}
}

async function toggleLocalAsr(){
 if(!localAsrPage||s.phase!=='ready'||micPending)return;
 if(micCapture){releaseMic();s.session.localAsr=false;render();return}
 const epoch=++micEpoch;
 micPending=true;
 render();
 let stream;
 try{
  const status=await fetch('/api/naming/status',{signal:AbortSignal.timeout(3000)});
  if(!status.ok||!(await status.json()).ready)throw new Error('语音识别未就绪');
  if(epoch!==micEpoch)return;
  if(!navigator.mediaDevices?.getUserMedia||!window.AudioWorkletNode)throw new Error('请在支持麦克风的桌面 Chrome 打开演示');
  stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,autoGainControl:false,noiseSuppression:false,echoCancellation:false}});
  if(epoch!==micEpoch){stream.getTracks().forEach(track=>track.stop());return}
  const capture=await openCapture(stream);
  if(epoch!==micEpoch){capture.close();return}
  micCapture=capture;
  s.session.localAsr=true;
 }catch(error){
  stream?.getTracks().forEach(track=>track.stop());
  if(epoch===micEpoch)toast(error.name==='NotAllowedError'?'麦克风权限未开启，可重试或使用模拟评分':esc(error.message));
 }finally{
  if(epoch===micEpoch){micPending=false;render()}
 }
}

function wavBlob(samples,inputRate){
 const rate=16000,ratio=inputRate/rate;
 const count=Math.floor(samples.length/ratio);
 const bytes=new ArrayBuffer(44+count*2),view=new DataView(bytes);
 const tag=(offset,value)=>[...value].forEach((c,i)=>view.setUint8(offset+i,c.charCodeAt(0)));
 tag(0,'RIFF');view.setUint32(4,36+count*2,true);tag(8,'WAVE');tag(12,'fmt ');
 view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
 view.setUint32(24,rate,true);view.setUint32(28,rate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);
 tag(36,'data');view.setUint32(40,count*2,true);
 for(let i=0;i<count;i++){
  const first=Math.floor(i*ratio),last=Math.min(samples.length,Math.max(first+1,Math.floor((i+1)*ratio)));
  let sum=0;
  for(let j=first;j<last;j++)sum+=samples[j];
  const sample=Math.max(-1,Math.min(1,sum/(last-first)));
  view.setInt16(44+i*2,Math.round(sample*(sample<0?32768:32767)),true);
 }
 return new Blob([bytes],{type:'audio/wav'});
}

async function finishLocalAnswer(){
 if(s.phase!=='picture')return;
 const token=++s.token;
 const item=queue[s.index];
 const capture=micCapture;
 s.phase='recognizing';
 s.voiceTrial={transcript:'',verdict:'待复核',match:'正在识别'};
 render();
 try{
  if(!capture?.live())throw new Error('麦克风已断开');
  const samples=await capture.stop();
  if(token!==s.token)return;
  if(!samples.length)throw new Error('没有收到录音');
  const wav=wavBlob(samples,capture.rate);
  const audioUrl=URL.createObjectURL(wav);
  voiceUrls.add(audioUrl);
  s.voiceTrial.audioUrl=audioUrl;
  const controller=new AbortController();
  asrRequest=controller;
  const timer=setTimeout(()=>controller.abort(),hostedAsr?52000:14500);
  try{
   const response=await fetch('/api/naming/score?item='+encodeURIComponent(item.key),{
    method:'POST',headers:{'Content-Type':'audio/wav'},body:wav,signal:controller.signal
   });
   const result=await response.json();
   if(token!==s.token)return;
   if(!response.ok)throw new Error(result.error||'语音识别未完成');
   if(result.item!==item.key)throw new Error('识别结果和当前图片不一致');
   Object.assign(s.voiceTrial,result);
  }finally{
   clearTimeout(timer);
   if(asrRequest===controller)asrRequest=null;
  }
 }catch(error){
  if(token!==s.token)return;
  s.voiceTrial.match=error.name==='AbortError'?'识别超时，请回听后评分':error.message;
 }
 if(token!==s.token)return;
 s.selected=initialScore[s.voiceTrial.verdict]||null;
 s.phase='review';
 render();
}

function voiceReview(voice){
 if(!voice)return '';
 return `<div class="voice-review">
  <div><span class="badge ${voice.verdict==='正确'?'green':''}">初判 ${esc(voice.verdict)}</span> <small>${esc(voice.match)}</small></div>
  <p>识别到 <b>${esc(voice.transcript||'—')}</b></p>
  ${voice.audioUrl?`<audio controls preload="metadata" aria-label="回听本题录音" src="${esc(voice.audioUrl)}"></audio>`:''}
 </div>`;
}

function run(){
 const cfg=s.session;
 const local=Boolean(cfg.localAsr);
 const item=queue[s.index];
 const ready=s.phase==='ready';
 const canStop=!['未开始','已停止'].includes(s.stim);
 const phaseLabels={ready:'准备就绪',starting:'刺激缓升中',waiting:'刺激阶段',fix:'注视点',picture:'请口头命名',recognizing:'正在识别',review:'等待评分',gap:'试次间隔',finished:'实验结束'};
 const phaseLabel=phaseLabels[s.phase];
 const design=cfg.mode==='online'?'刺激期间命名':'刺激后命名';
 const intro=cfg.mode==='online'?'刺激缓升后呈现第一张图，换图时刺激持续。':'先完成刺激，再开始呈现图片。';
 const shownTrial=String(s.index+1).padStart(2,'0');
 const context=`<div class="naming-context crumb">
  <button class="pill" onclick="navigate('setup')">← 返回 / 实验设置</button>
  <span class="pill muted">受试者：${esc(cfg.subject)}</span>
  <span class="pill muted">${esc(cfg.id)}</span>
  <span class="badge purple">单刺激模式</span>
 </div>`;
 const startButton=`<button class="primary naming-start" ${micPending?'disabled':''} onclick="start()">开始实验 ▶</button>`;
 const stopButton=`<button class="danger" ${canStop?'':'disabled'} onclick="emergency()">紧急停止</button>`;
 const finishButton='<button onclick="finishAsk()">结束实验</button>';
 const viewButton=`<button onclick="s.present=!s.present;render()">${s.present?'返回操作视图':'受试者视图'}</button>`;

 let picture;
 switch(s.phase){
  case 'picture': picture=art(item.key);break;
  case 'fix': picture='<div class="fix">＋</div>';break;
  case 'review':
   picture=`<h2>本试次呈现结束</h2><p>${s.present?'请等待研究人员确认':'请在下方确认命名结果'}</p>`;
   break;
  default:
   picture=`<h2>${ready?'准备开始图片命名':phaseLabel}</h2><p>${ready?'看到图片后，请尽快、准确地说出名称。':'请稍候'}</p>`;
 }
 const stage=`<div class="stage naming-stage">${picture}
  ${s.phase==='fix'?'<span class="hint">请注视屏幕中心</span>':''}
  ${s.phase==='picture'?'<span class="hint">请直接说出图片名称</span>':''}
  ${s.present&&ready?startButton:''}
 </div>`;
 document.body.classList.toggle('present',s.present);
 if(s.present){
  document.getElementById('app').innerHTML=`<main class="naming-run naming-presentation">
   <section class="card naming-panel" aria-label="受试者视图">
    <div class="heading naming-panel-heading"><div class="row"><h1>图片命名</h1><span class="badge">${phaseLabel}</span></div>
    <div class="row">${viewButton}${finishButton}${stopButton}</div></div>
    ${stage}
   </section>
  </main>`;
  return;
 }

 const saved=s.records.filter(record=>record.score!=='interrupted');
 const correct=saved.filter(record=>record.score==='correct').length;
 const incorrect=saved.filter(record=>record.score==='wrong').length;
 const accuracy=saved.length?`${Math.round(correct/saved.length*100)}%`:'—';
 let response;
 if(s.phase==='picture'){
  response=`<div class="heading"><div><h3>回答窗口 <span id="remaining">${remaining()}</span> 秒</h3><small>${local?'正在录音 · '+asrLabel:'模拟录音'}</small></div>
   ${local?'<button onclick="finishLocalAnswer()">提交本题录音</button>':'<button class="primary" onclick="respond(true)">模拟命名回答</button>'}</div>`;
 }else if(s.phase==='review'){
  const reaction=local?(s.rt===null?'反应时待校正':`反应时 ${s.rt} ms · 人工录入`):(s.rt===null?'未检测到回答（演示）':`发声反应时：${s.rt} ms · 示例值`);
  const scoreButtons=[['correct','✓ 正确','good'],['wrong','× 错误','danger'],['none','— 无反应','']];
  response=`<div class="heading"><div><h3>目标词：${item.word}</h3><small>${reaction}</small></div><button onclick="adjust()">校正反应时</button></div>${voiceReview(s.voiceTrial)}
   <div class="review-actions">${scoreButtons.map(([value,label,color])=>`<button class="${color} ${s.selected===value?'selected':''}" onclick="s.selected='${value}';render()">${label}</button>`).join('')}
   <button class="primary naming-next" ${s.selected?'':'disabled'} onclick="saveTrial()">${s.index===queue.length-1?'保存并结束':'保存并下一张 →'}</button></div>`;
 }else{
  response=`<p class="muted">${ready?intro:s.phase==='fix'?'正在呈现注视点…':s.phase==='gap'?'正在进入下一试次…':s.phase==='recognizing'?'正在识别本题录音…':'等待当前阶段完成。'}</p>`;
 }
 const settings=[
  ['实验设计',design],['评分方式',local?asrLabel+' · 自动初判':'模拟评分'],['图片材料','常见物品 01'],['呈现顺序',cfg.order==='random'?'随机顺序':'固定顺序'],
  ['注视点',`${cfg.fix} 秒`],['回答窗口',`${cfg.window} 秒`],['试次间隔',`${cfg.isi} 秒`]
 ];
 const micToggle=ready&&localAsrPage?`<button class="naming-mic" ${micPending?'disabled':''} onclick="toggleLocalAsr()">${micPending?'等待麦克风授权…':local?'✓ 麦克风已连接 · 切换到模拟':hostedAsr?'启用录音识别':'启用本地录音识别'}</button>`:'';
 document.getElementById('app').innerHTML=`<main class="naming-run">
  <div class="naming-main">
   ${context}
   <section class="card naming-panel" aria-label="图片命名执行">
    <div class="heading naming-panel-heading"><div class="row"><h1>图片呈现</h1><span class="badge">${phaseLabel}</span></div>${viewButton}</div>
    ${stage}
    <section class="naming-scoring" aria-label="试次与评分">
     <div class="heading naming-panel-heading"><div class="row"><h2>图片命名</h2><span class="badge">常见物品 01</span></div><span class="naming-trial">第 <b>${shownTrial}</b> / ${String(queue.length).padStart(2,'0')} 试次</span></div>
     <div class="naming-stats">
      <div>已保存 <b>${saved.length} / ${queue.length}</b></div><div>正确 <b class="count-correct">${correct}</b></div><div>错误 <b class="count-incorrect">${incorrect}</b></div><div>正确率 <b>${accuracy}</b></div>
     </div>
     <div class="record-box naming-response">${response}</div>
    </section>
    ${ready?'<div class="naming-example"><button class="demo-link" onclick="sampleResults()">快速查看完整示例结果 →</button></div>':''}
   </section>
  </div>
  <aside class="card naming-monitor" aria-label="刺激方案与实验设置">
   <section>
    <h2>tDCS 刺激方案</h2>
    <div class="naming-stim">
     <div class="kv"><span>运行状态</span><b><span class="status-dot" style="background:${s.stim==='刺激中'?'var(--green)':'#8b9fc0'}"></span>${s.stim}</b></div>
     <div class="kv"><span>累计刺激 · 模拟</span><b id="elapsed">${time(s.elapsed)}</b></div>
     <div class="stim-diagram"><svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="968.083" height="181.196" viewBox="0 0 968.083 181.196" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Group 1">
<path id="&#232;&#183;&#175;&#229;&#190;&#132;" d="M0.655619 180.75L100.655 0.75H834.13L967.481 180.75" stroke="#9536F3" stroke-width="1.5"/>
</g>
</svg></div>
     <button class="demo-link" onclick="plan()">查看方案与点位 →</button>
    </div>
   </section>
   <section class="naming-settings">
    <h2>实验设置</h2>
    ${hostedAsr&&ready?'<p class="note naming-hosted-note">开启录音后，单题录音会发送至演示服务器识别。服务器处理后删除临时录音。</p>':''}
    <dl>${settings.map(([label,value])=>`<div><dt>${label}</dt><dd>${label==='评分方式'&&micToggle?micToggle:value}</dd></div>`).join('')}</dl>
   </section>
   <div class="naming-controls">
    <div class="row">${finishButton}${stopButton}</div>
    ${ready?startButton:''}
   </div>
  </aside>
 </main>`;
}
function start(){if(s.phase!=='ready'||!s.ready||micPending)return;if(s.session.localAsr&&!micCapture?.live())return toast('请重新连接麦克风');clearTimers();s.stim='缓升中';s.phase='starting';render();let token=s.token;ticker=setInterval(()=>{if(['缓升中','刺激中','缓降中'].includes(s.stim))s.elapsed++;const el=document.getElementById('elapsed');if(el)el.textContent=time(s.elapsed)},1000);setTimeout(()=>{if(token!==s.token)return;s.stim='刺激中';if(s.session.mode==='online')trial();else{s.phase='waiting';render();setTimeout(()=>{if(token!==s.token)return;s.stim='缓降中';render();setTimeout(()=>{if(token!==s.token)return;s.stim='已停止';clearInterval(ticker);trial()},3000)},3000)}},3000)}
function trial(){s.phase='fix';s.voiceTrial=null;s.selected=null;s.rt=null;s.originalRt=null;s.trialPresented=false;render();const token=++s.token;setTimeout(()=>{if(token!==s.token)return;s.phase='picture';s.trialPresented=true;s.deadline=Date.now()+s.session.window*1000;if(s.session.localAsr)micCapture?.start();render();const clock=setInterval(()=>{if(token!==s.token||s.phase!=='picture'){clearInterval(clock);return}const n=remaining();const el=document.getElementById('remaining');if(el)el.textContent=n;if(n<=0){clearInterval(clock);if(s.session.localAsr)void finishLocalAnswer();else respond(false)}},100)},s.session.fix*1000)}
function respond(has){if(s.phase!=='picture'||s.session.localAsr)return;s.token++;s.phase='review';s.rt=has?queue[s.index].rt:null;s.originalRt=s.rt;s.selected=has?'correct':'none';render()}
function saveTrial(){if(s.phase!=='review'||!s.selected)return;const x=queue[s.index];s.records.push({...x,trial:s.index+1,score:s.selected,rt:s.rt,originalRt:s.originalRt,corrected:s.rt!==s.originalRt,scoreEdited:Boolean(s.voiceTrial&&s.selected!==initialScore[s.voiceTrial.verdict]),voice:s.voiceTrial});s.trialPresented=false;if(s.index===queue.length-1)return finish('completed');s.index++;s.phase='gap';render();const token=++s.token;setTimeout(()=>{if(token===s.token)trial()},s.session.isi*1000)}
function adjust(){dialog(`<div class="heading"><h2>反应时校正${s.session.localAsr?'':' · 演示'}</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">${s.session.localAsr?'回听录音后，填写已确认的发声反应时。':'正式功能通过录音定位发声起点。这里用输入框演示校正结果。'}</p><div class="field" style="margin-top:20px"><label>反应时 / ms</label><input id="rtedit" type="number" min="100" max="${s.session.window*1000}" value="${s.rt??(s.session.localAsr?'':700)}"></div><div class="foot"><button class="primary" onclick="const n=+document.getElementById('rtedit').value;if(!Number.isFinite(n)||n<100||n>s.session.window*1000){toast('请输入回答窗口内的反应时');return}s.rt=n;closeModal();render()">${s.session.localAsr?'保存校正':'保存示例校正'}</button></div>`)}
function finishAsk(){if(s.phase==='finished')return;dialog(`<div class="heading"><h2>结束本次实验？</h2><button class="close" onclick="closeModal()">×</button></div><p>已保存 ${s.records.length} / 6 个试次。已呈现但未保存的当前试次将标为中断。</p><div class="note">若刺激仍在运行，先进入模拟缓降，确认停止后再展示结果。</div><div class="foot"><button onclick="closeModal()">继续实验</button><button class="primary" onclick="closeModal();finish('early')">结束并保存</button></div>`)}
function saveInterrupted(reason){if(!s.trialPresented||s.records.some(x=>x.trial===s.index+1))return;s.records.push({...queue[s.index],trial:s.index+1,score:'interrupted',rt:s.rt,originalRt:s.originalRt,corrected:s.rt!==s.originalRt,scoreEdited:false,voice:s.voiceTrial,reason});s.trialPresented=false}
function showResults(){
 releaseMic();
 clearTimers();
 s.page='results';
 s.present=false;
 s.checks=[false,false,false];
 closeModal();
 render();
}
function finish(reason='early'){
 if(s.phase==='finished')return;
 saveInterrupted(reason);
 s.endReason=reason;
 s.phase='finished';
 s.present=false;
 const token=++s.token;
 releaseMic();
 if(['未开始','已停止'].includes(s.stim))return showResults();
 s.stim='缓降中';
 render();
 let seconds=3;
 dialog(`<h2>实验已结束，刺激正在缓降</h2><div class="ring" id="count">3</div><p class="muted" style="text-align:center">演示加速 · 等待模拟设备停止确认</p><div class="foot" style="justify-content:center"><button class="danger" onclick="emergency()">紧急停止</button></div>`,true);
 const timer=setInterval(()=>{
  if(token!==s.token){clearInterval(timer);return}
  if(--seconds===0){
   s.stim='已停止';
   showResults();
   return;
  }
  document.getElementById('count').textContent=seconds;
 },1000);
 rampTimer=timer;
}
function emergency(){
 if(['未开始','已停止'].includes(s.stim))return;
 saveInterrupted('emergency');
 s.endReason='emergency';
 s.phase='finished';
 s.stim='已停止';
 showResults();
 toast('模拟紧急停止，已保留本次记录');
}
function sampleResults(){if(active())return toast('请先完成或结束当前实验');clearVoiceRecords();queue=[...items];s.session={...snapshot(),order:'fixed'};s.stim='已停止';s.phase='finished';s.elapsed=92;s.endReason='completed';s.trialPresented=false;s.ready=true;s.records=items.map((x,i)=>({...x,trial:i+1,score:i===3?'wrong':'correct',originalRt:x.rt,corrected:false,scoreEdited:false}));showResults()}
function results(){
 const cfg=s.session||s,rec=s.records,scored=rec.filter(x=>x.score!=='interrupted'),good=scored.filter(x=>x.score==='correct'),valid=good.filter(x=>Number.isFinite(x.rt));
 const avg=valid.length?Math.round(valid.reduce((a,x)=>a+x.rt,0)/valid.length):null,acc=scored.length?Math.round(good.length/scored.length*100):null;
 const plotted=rec.filter(x=>['correct','wrong'].includes(x.score)&&Number.isFinite(x.rt));
 const max=Math.max(1200,...plotted.map(x=>x.rt)),step=Math.ceil(max/3/100)*100,top=step*3,y=v=>170-v/top*140;
 const chart=plotted.map(x=>`<circle cx="${80+(x.trial-1)*104}" cy="${y(x.rt)}" r="5" fill="${x.score==='correct'?'#4947cf':'#ed6472'}"/><text x="${80+(x.trial-1)*104}" y="${y(x.rt)-12}" text-anchor="middle" fill="#7890ae" font-size="12">${x.rt}</text>`).join('');
 const ended={completed:'✓ 任务完成',early:'提前结束',emergency:'紧急停止'}[s.endReason]||'未开始即结束';
 shell(`<div class="heading"><div><h1>图片命名 · 实验结果</h1><p>命名表现与刺激记录 · ${cfg.localAsr?asrLabel:'示例数据'}</p></div><div class="row"><button onclick="exportCSV()">导出 CSV</button><button class="primary" onclick="reset()">新一次实验</button></div></div>${tabs()}<div class="row result-context" style="justify-content:space-between"><span class="badge ${s.endReason==='completed'?'green':''}">${ended} · 刺激${s.stim}</span><small>${cfg.mode==='online'?'刺激期间命名':'刺激后命名'} · ${cfg.order==='random'?'随机顺序':'固定顺序'} · 回答窗口 ${cfg.window} 秒</small></div><div class="metrics"><div class="metric"><label>命名正确率</label><strong>${acc===null?'—':acc+'%'}</strong><small>正确 ${good.length} / 已评分 ${scored.length}</small></div><div class="metric"><label>平均命名反应时</label><strong>${avg===null?'—':avg+' <span style="font-size:14px">ms</span>'}</strong><small>仅正确且 RT 有效的 ${valid.length} 次</small></div><div class="metric"><label>已完成试次</label><strong>${scored.length} <span style="font-size:15px;color:var(--muted)">/ 6</span></strong><small>中断 ${rec.length-scored.length} 次，不计入正确率</small></div><div class="metric"><label>刺激时长 · 模拟</label><strong>${time(s.elapsed)}</strong><small>tDCS · 示例方案 01</small></div></div><div class="chart"><div class="heading"><h2>逐图命名反应时 <small>ms</small></h2><small><span style="color:#4947cf">● 正确</span>　<span style="color:#ed6472">● 错误</span>　无反应、中断不绘制</small></div>${plotted.length?`<svg viewBox="0 0 680 205" role="img" aria-label="逐图反应时，单位毫秒">${[0,step,step*2,top].map(v=>`<line x1="52" y1="${y(v)}" x2="650" y2="${y(v)}" stroke="#e5ebf4"/><text x="42" y="${y(v)+4}" text-anchor="end" fill="#7890ae" font-size="11">${v}</text>`).join('')}${chart}${rec.map(x=>`<text x="${80+(x.trial-1)*104}" y="197" text-anchor="middle" fill="#7890ae" font-size="12">${x.word}</text>`).join('')}</svg>`:'<div class="chart-empty">暂无有效反应时数据</div>'}</div><div class="heading" style="margin-top:24px"><h2>试次明细</h2><small>可修改已完成试次的评分，汇总同步更新</small></div><div class="table-wrap"><table><thead><tr><th>试次</th><th>目标词</th><th>命名结果</th><th>反应时</th><th>数据状态</th><th>操作</th></tr></thead><tbody>${rec.map((x,i)=>`<tr><td>${String(x.trial).padStart(2,'0')}</td><td>${x.word}</td><td style="color:${x.score==='correct'?'var(--green)':x.score==='wrong'?'var(--red)':'var(--muted)'}">${{correct:'正确',wrong:'错误',none:'无反应',interrupted:'中断'}[x.score]}</td><td>${!['correct','wrong'].includes(x.score)||x.rt===null?'—':x.rt+' ms'}</td><td>${x.score==='interrupted'?'不计入统计':x.voice?esc(x.voice.match):x.score==='none'&&x.rt!==null?'保留原 RT · 不计入统计':x.rt===null?'RT 缺失 · 示例':x.corrected?'RT 已校正 · 示例':'示例数据'}${x.scoreEdited?' · 评分已修改':''}</td><td>${x.score==='interrupted'?'—':`<button onclick="editScore(${i})">修改评分</button>`}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">尚未呈现图片，本次没有试次记录。</td></tr>'}</tbody></table></div><div class="note">${cfg.localAsr?'结果按最终评分统计，试次详情保留录音和系统初判。反应时由人工录入，刺激状态为模拟。':'本页反应时与刺激反馈均为演示数据。无反应计入已评分试次，RT 缺失不以 0 计算；中断试次不计入正确率。'}</div><div class="foot"><small>本次条件已固定，数据仅保留在页面会话中</small><button onclick="navigate('setup')">返回实验设置</button></div>`)
}
function editScore(i){const x=s.records[i];if(x.score==='interrupted')return;dialog(`<div class="heading"><h2>修改评分 · ${x.word}</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">修改后按最终评分统计。</p>${voiceReview(x.voice)}<div class="review-actions">${[['correct','正确'],['wrong','错误'],['none','无反应']].map(([v,t])=>`<button class="${x.score===v?'selected':''}" onclick="updateScore(${i},'${v}')">${t}</button>`).join('')}</div>`)}
function updateScore(i,value){if(s.records[i].score!==value){s.records[i].score=value;s.records[i].scoreEdited=true}closeModal();render()}
function exportCSV(){
 const c=s.session;
 const conditions=[c.id,c.subject,c.mode,c.order,c.fix,c.window,c.isi,c.createdAt,s.endReason,s.elapsed];
 const rows=[['experiment_id','subject','design','order','fix_s','window_s','isi_s','created_at','end_reason','stimulation_seconds_demo','trial','material_id','material','score','rt_ms','original_rt_ms','rt_included','rt_corrected','score_edited','source','asr_transcript','asr_initial_score','asr_match']];
 for(const record of s.records){
  rows.push([...conditions,record.trial,record.id,record.word,record.score,record.rt??'',record.originalRt??'',record.score==='correct'&&Number.isFinite(record.rt),record.corrected,record.scoreEdited,record.voice?(hostedAsr?'prototype_hosted_asr':'prototype_local_asr'):'prototype_demo',record.voice?.transcript||'',record.voice?.verdict||'',record.voice?.match||'']);
 }
 if(!s.records.length)rows.push([...conditions,...Array(9).fill(''),c.localAsr?(hostedAsr?'prototype_hosted_asr':'prototype_local_asr'):'prototype_demo','','','']);
 const cell=value=>{
  const text=String(value);
  const escaped=/^[\s]*[=+@-]/.test(text)?"'"+text:text;
  return '"'+escaped.replace(/"/g,'""')+'"';
 };
 const csv='\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n');
 const link=document.createElement('a');
 link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 link.download='图片命名_'+c.id+'_示例结果.csv';
 link.click();
 setTimeout(()=>URL.revokeObjectURL(link.href),1000);
}
function reset(){if(active())return toast('请先完成或结束当前实验');clearVoiceRecords();clearTimers();closeModal();Object.assign(s,{page:'setup',phase:'ready',stim:'未开始',index:0,records:[],elapsed:0,ready:false,present:false,checks:[false,false,false],session:null,rt:null,originalRt:null,trialPresented:false,endReason:null});render()}
const preview=new URLSearchParams(location.search).get('preview');if(preview==='results')sampleResults();else if(preview==='run'){s.checks=[true,true,true];enter()}else render();
</script></body></html>
